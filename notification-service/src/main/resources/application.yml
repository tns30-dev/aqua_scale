spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:aquashield}
    username: ${DB_USER:notification_svc}
    password: ${DB_PASSWORD:notification_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification
    open-in-view: false

  flyway:
    schemas: notification
    default-schema: notification

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  cloud:
    gcp:
      project-id: ${PUBSUB_PROJECT_ID:aquashield-local}
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}

server:
  port: ${SERVER_PORT:8087}   # 8085/8086 are the pubsub/bigtable emulators on host

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

aquashield:
  jwt:
    issuer: ${JWT_ISSUER:aquashield-local}
    audience: ${JWT_AUDIENCE:aquashield-api}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  notification:
    readings-subscription: ${READINGS_SUBSCRIPTION:notification.reading.ingested.sub}
    settings-subscription: ${SETTINGS_SUBSCRIPTION:notification.project.settings.updated.sub}
    threshold-cache-ttl: ${THRESHOLD_CACHE_TTL:PT15M}
  grpc:
    project:
      target: ${PROJECT_GRPC_TARGET:localhost:9092}
      in-process-name: ${PROJECT_GRPC_INPROCESS:}
  events:
    enabled: ${EVENTS_ENABLED:true}
    source: notification-service
