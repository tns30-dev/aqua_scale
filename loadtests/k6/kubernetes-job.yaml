apiVersion: batch/v1
kind: Job
metadata:
  name: aquashield-k6-busy-day
  namespace: aquashield-dev
  labels:
    app.kubernetes.io/name: aquashield-k6
    app.kubernetes.io/part-of: aquashield
    app.kubernetes.io/component: performance-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aquashield-k6
        app.kubernetes.io/part-of: aquashield
        app.kubernetes.io/component: performance-test
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.54.0
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /scripts/busy-day.js
            - --summary-export
            - /results/summary.json
          env:
            - name: BASE_URL
              value: http://api-edge-proxy:8080
            - name: WS_URL
              value: ws://api-edge-proxy:8080/ws
            - name: VUS
              value: "25"
            - name: HOLD
              value: 5m
            - name: LOADTEST_EMAIL_TEMPLATE
              value: "loadtest{:03d}@example.com"
            - name: LOADTEST_ACCOUNT_COUNT
              value: "50"
            - name: LOADTEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aquashield-k6-credentials
                  key: password
                  optional: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: results
              mountPath: /results
      volumes:
        - name: scripts
          configMap:
            name: aquashield-k6-scripts
        - name: results
          emptyDir: {}
