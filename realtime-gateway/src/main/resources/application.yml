spring:
  application:
    name: realtime-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  cloud:
    gcp:
      project-id: ${PUBSUB_PROJECT_ID:aquashield-local}
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}

server:
  port: ${SERVER_PORT:8088}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

aquashield:
  jwt:
    issuer: ${JWT_ISSUER:aquashield-local}
    audience: ${JWT_AUDIENCE:aquashield-api}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  realtime:
    # short-lived one-time WS token (spec: /ws/token mint -> first-frame AUTH)
    ws-token-ttl: ${WS_TOKEN_TTL:PT60S}
    auth-timeout: ${WS_AUTH_TIMEOUT:PT10S}
    subscription-ttl: ${WS_SUBSCRIPTION_TTL:PT5M}
    # empty = allow any origin (local dev); cloud sets the Firebase frontend origin
    allowed-origins: ${WS_ALLOWED_ORIGINS:}
    readings-subscription: ${READINGS_SUBSCRIPTION:realtime.reading.ingested.sub}
    alert-created-subscription: ${ALERT_CREATED_SUBSCRIPTION:realtime.alert.created.sub}
    alert-resolved-subscription: ${ALERT_RESOLVED_SUBSCRIPTION:realtime.alert.resolved.sub}
  events:
    source: realtime-gateway
