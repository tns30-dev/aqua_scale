syntax = "proto3";

package aquashield.notification.v1;

option java_multiple_files = true;
option java_package = "com.aquashield.api.notification.v1";

// Notification Service — internal gRPC contract.
// First consumer: Project Service's overview summary (activeAlerts count).
service NotificationService {

  // Active = acknowledged=false AND resolved=false (the monolith's summary filter).
  rpc GetActiveAlertCount (GetActiveAlertCountRequest) returns (GetActiveAlertCountResponse);

  // Daily-health rollup dependency: counts pond-scoped alert_log rows in an
  // aware [start_at, end_at) window, grouped by pond and log_type. Project-level
  // energy alerts have no pond_id and are intentionally excluded.
  rpc GetPondAlertCounts (GetPondAlertCountsRequest) returns (GetPondAlertCountsResponse);
}

message GetActiveAlertCountRequest {
  string project_id = 1;
}

message GetActiveAlertCountResponse {
  int64 count = 1;
}

message GetPondAlertCountsRequest {
  string project_id = 1;
  repeated string pond_ids = 2;
  string start_at = 3; // ISO-8601 instant/offset, inclusive
  string end_at = 4;   // ISO-8601 instant/offset, exclusive
}

message PondAlertCount {
  string pond_id = 1;
  int64 alert_count = 2;   // log_type = "alert"
  int64 warning_count = 3; // log_type = "warning"
}

message GetPondAlertCountsResponse {
  repeated PondAlertCount counts = 1;
}
