syntax = "proto3";

package aquashield.ingestion.v1;

option java_multiple_files = true;
option java_package = "com.aquashield.api.ingestion.v1";

// Ingestion Service — internal READ contract over the telemetry store.
// The long-flagged [XSVC] dependency: Analytics (charts), Pond (comparison) and Project
// (energy dashboard) consume readings through THIS seam instead of touching the store.
// Backed today by the Postgres demo store; the Bigtable target sits behind the same
// ReadingStore seam (main/polyglot_persistence.md).
service IngestionReadService {

  // Time-range query for one pond. Returns rows ordered by measured_at ASC.
  rpc GetReadings (GetReadingsRequest) returns (GetReadingsResponse);

  // First/last measured_at per pond (Pond comparison options: hasSensorData,
  // firstReadingAt, lastReadingAt — the monolith's batched Min/Max aggregate).
  rpc GetReadingWindows (GetReadingWindowsRequest) returns (GetReadingWindowsResponse);

  // Latest numeric reading payload per pond for UI bootstrapping before WebSocket
  // messages arrive. Used by Overview/Digital Twin to avoid a stale "No Readings"
  // state when persisted telemetry already exists.
  rpc GetLatestReadings (GetLatestReadingsRequest) returns (GetLatestReadingsResponse);

  // Project-wide electricity aggregation for the Energy dashboard. This keeps
  // high-volume time bucketing beside the telemetry store instead of sending raw
  // readings across the Project/Ingestion service boundary.
  rpc GetEnergyHourlyReadings (GetEnergyHourlyReadingsRequest) returns (GetEnergyHourlyReadingsResponse);

  // Pond-scoped parameter averages for comparison charts/cards. This avoids moving
  // high-volume raw telemetry across the Pond/Ingestion service boundary.
  rpc GetPondParameterBucketAverages (GetPondParameterBucketAveragesRequest) returns (GetPondParameterBucketAveragesResponse);
}

message GetLatestReadingsRequest {
  string project_id = 1;
  // Optional; empty = all ponds in the project that have readings.
  repeated string pond_ids = 2;
}

message LatestReadingRow {
  string pond_id = 1;
  string measured_at = 2;        // ISO-8601 instant
  string project_sensor_id = 3;
  string port = 4;
  map<string, double> values = 5;
}

message GetLatestReadingsResponse {
  repeated LatestReadingRow readings = 1;
}

message GetEnergyHourlyReadingsRequest {
  string project_id = 1;
  string start = 2;              // ISO-8601 instant (inclusive)
  string end = 3;                // ISO-8601 instant (inclusive)
  string timezone = 4;           // IANA zone, e.g. Asia/Singapore
}

message EnergyHourlyReading {
  string hour_start = 1;         // ISO-8601 instant at local-hour bucket start
  double kwh = 2;
}

message GetEnergyHourlyReadingsResponse {
  string project_id = 1;
  repeated EnergyHourlyReading rows = 2;
}

message GetPondParameterBucketAveragesRequest {
  string pond_id = 1;
  string start = 2;              // ISO-8601 instant (inclusive)
  string end = 3;                // ISO-8601 instant (inclusive)
  string timezone = 4;           // IANA zone, e.g. Asia/Singapore
  string grouping = 5;           // hourly, daily, weekly, monthly
  repeated string parameters = 6;
}

message PondParameterBucketAverage {
  string pond_id = 1;
  string parameter = 2;
  string bucket_start = 3;       // ISO-8601 instant at local bucket start
  double average = 4;
  int64 sample_count = 5;
}

message GetPondParameterBucketAveragesResponse {
  string pond_id = 1;
  repeated PondParameterBucketAverage rows = 2;
}

message GetReadingWindowsRequest {
  repeated string pond_ids = 1;
}

message ReadingWindow {
  string pond_id = 1;
  string first_at = 2;           // ISO-8601 instant (UTC)
  string last_at = 3;
}

message GetReadingWindowsResponse {
  // only ponds that HAVE readings appear
  repeated ReadingWindow windows = 1;
}

message GetReadingsRequest {
  // Selector: exactly one of pond_id / project_id (pond_id wins when both set).
  // project_id serves project-wide consumers (Project energy dashboard).
  string pond_id = 1;
  string start = 2;              // ISO-8601 instant (inclusive)
  string end = 3;                // ISO-8601 instant (inclusive)
  // optional filter; empty = all parameters present in each row
  repeated string parameters = 4;
  // safety valve; server clamps to its maximum (default 50000)
  int32 limit = 5;
  string project_id = 6;
}

message ReadingRow {
  string measured_at = 1;        // ISO-8601 instant
  string project_sensor_id = 2;
  string port = 3;
  // parameter_code -> numeric value for this row (non-numeric values omitted)
  map<string, double> values = 4;
  string pond_id = 5;            // row attribution for project-wide queries
}

message GetReadingsResponse {
  string pond_id = 1;            // echo of the pond selector (empty for project queries)
  repeated ReadingRow rows = 2;
  bool truncated = 3;            // true when the limit clipped the range
}
