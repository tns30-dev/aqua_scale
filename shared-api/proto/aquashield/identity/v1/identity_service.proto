syntax = "proto3";

package aquashield.identity.v1;

import "google/protobuf/timestamp.proto";
import "aquashield/common/v1/common.proto";

option java_multiple_files = true;
option java_package = "com.aquashield.shared.api.identity.v1";
option csharp_namespace = "AquaShield.Shared.Api.Identity.V1";

service IdentityAccessService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc GetAuthorizationSnapshot(GetAuthorizationSnapshotRequest) returns (AuthorizationSnapshot);
  rpc GetUserAccess(GetUserAccessRequest) returns (UserAccess);
  rpc AuthorizeAction(AuthorizeActionRequest) returns (AuthorizeActionResponse);
  rpc GetProjectUsers(GetProjectUsersRequest) returns (GetProjectUsersResponse);
}

message ValidateTokenRequest {
  aquashield.common.v1.RequestContext context = 1;
  string token = 2;
  string expected_audience = 3;
}

message ValidateTokenResponse {
  bool valid = 1;
  TokenPrincipal principal = 2;
  string denial_reason = 3;
}

message TokenPrincipal {
  string user_id = 1;
  string email = 2;
  string role_id = 3;
  string role_name = 4;
  string authz_snapshot_key = 5;
  string authz_snapshot_version = 6;
  string jti = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message GetAuthorizationSnapshotRequest {
  aquashield.common.v1.RequestContext context = 1;
  string user_id = 2;
  string authz_snapshot_key = 3;
  bool force_rebuild = 4;
}

message AuthorizationSnapshot {
  string user_id = 1;
  string authz_snapshot_key = 2;
  string authz_snapshot_version = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated FeaturePermission feature_permissions = 6;
  repeated ProjectAccess project_access = 7;
  repeated PondAccess pond_access = 8;
}

message FeaturePermission {
  string module = 1;
  string feature = 2;
  string action = 3;
  bool allowed = 4;
}

message ProjectAccess {
  string project_id = 1;
  repeated string actions = 2;
  bool admin = 3;
}

message PondAccess {
  string project_id = 1;
  string pond_id = 2;
  repeated string actions = 3;
}

message GetUserAccessRequest {
  aquashield.common.v1.RequestContext context = 1;
  string user_id = 2;
}

message UserAccess {
  string user_id = 1;
  repeated ProjectAccess project_access = 2;
  repeated PondAccess pond_access = 3;
}

message AuthorizeActionRequest {
  aquashield.common.v1.RequestContext context = 1;
  string user_id = 2;
  string action = 3;
  aquashield.common.v1.ResourceScope scope = 4;
  string required_freshness = 5;
}

message AuthorizeActionResponse {
  bool allowed = 1;
  string reason_code = 2;
  string reason_message = 3;
  string authz_snapshot_version = 4;
}

message GetProjectUsersRequest {
  aquashield.common.v1.RequestContext context = 1;
  string project_id = 2;
  string required_action = 3;
}

message GetProjectUsersResponse {
  repeated ProjectUser users = 1;
}

message ProjectUser {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  string role_name = 4;
  repeated string actions = 5;
}
