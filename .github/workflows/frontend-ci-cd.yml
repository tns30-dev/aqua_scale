# Manual AquaShield frontend Firebase deployment fallback.
#
# Normal branch automation now lives in:
# - ci.yml for frontend type/lint/test/build evidence on main/dev/test
# - deploy-handoff.yml for main-only CD after CI passes
#
# Required GitHub configuration (deploy jobs SKIP CLEANLY until these exist):
#   secrets.FIREBASE_SERVICE_ACCOUNT  service-account JSON with the
#                                     "Firebase Hosting Admin" role on the project
#   vars.FIREBASE_PROJECT_ID          Firebase project id
#   vars.VITE_API_BASE_URL            e.g. https://api.aquashield.example.com
#   vars.VITE_WS_BASE_URL             e.g. wss://api.aquashield.example.com/ws
#   vars.FIREBASE_HOSTING_SITE        optional, when the site id differs from project id
# Safe default: pushes deploy to the STAGING channel; the live channel is reached only
# via manual workflow_dispatch (channel=live) for demo day.

name: Manual Frontend Firebase Deployment

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Hosting channel (staging is the safe default; live for demo)
        type: choice
        options: [staging, live]
        default: staging

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend Build, Test & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Run frontend unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build production frontend
        working-directory: frontend
        env:
          # placeholders keep CI green before the API edge exists; deploys use real vars
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.aquashield.example.com' }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL || 'wss://api.aquashield.example.com/ws' }}
        run: npm run build
      - name: Publish frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontend Build Artifact - Firebase Hosting
          path: frontend/dist/
          retention-days: 7

  hosting-deploy:
    name: Manual Firebase Hosting Deployment
    needs: frontend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: creds
        name: Check Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Hosting deploy skipped — configure secrets.FIREBASE_SERVICE_ACCOUNT and vars.FIREBASE_PROJECT_ID to enable (see workflow header)."
          fi
      - name: Download frontend build
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Frontend Build Artifact - Firebase Hosting
          path: frontend/dist/
      - name: Deploy Firebase Hosting channel
        if: steps.creds.outputs.enabled == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: ${{ vars.FIREBASE_HOSTING_SITE }}
          entryPoint: frontend
          channelId: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'staging' }}
          expires: 30d
