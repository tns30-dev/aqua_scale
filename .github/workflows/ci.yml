# AquaShield sequential CI evidence pipeline.
#
# Branch policy:
# - main/dev/test run this CI evidence lane.
# - load-test is intentionally excluded; .github/workflows/perf.yml owns the
#   long k6 load/stress/growth/websocket evidence lane there.
# - deploy-handoff.yml owns the CD lane after this workflow passes on main.

name: AquaShield CI Evidence

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, test]
  workflow_dispatch:
    inputs:
      service_scope:
        description: "Evidence scope: all, changed, or comma-separated service ids"
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: devsecops-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  scope:
    name: 01 Scope - Select Frontend and Backend Workloads
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      analytics: ${{ steps.scope.outputs.analytics }}
      any-java: ${{ steps.scope.outputs.any-java }}
      any-container: ${{ steps.scope.outputs.any-container }}
      java-matrix: ${{ steps.scope.outputs.java-matrix }}
      container-matrix: ${{ steps.scope.outputs.container-matrix }}
      selected-labels: ${{ steps.scope.outputs.selected-labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Resolve evidence scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.service_scope || '' }}
        run: |
          set -euo pipefail

          JAVA_SERVICES=(
            identity-access-service
            project-service
            sensor-service
            ingestion-service
            notification-service
            realtime-gateway
            pond-service
            audit-service
          )

          service_label() {
            case "$1" in
              frontend) echo "Frontend Web App" ;;
              identity-access-service) echo "Identity and Access Service" ;;
              project-service) echo "Project Service" ;;
              sensor-service) echo "Sensor Service" ;;
              ingestion-service) echo "Ingestion Service" ;;
              notification-service) echo "Notification Service" ;;
              realtime-gateway) echo "Realtime Gateway" ;;
              pond-service) echo "Pond Service" ;;
              audit-service) echo "Audit Service" ;;
              analytics-service) echo "Analytics Service" ;;
              *) echo "$1" ;;
            esac
          }

          service_json() {
            jq -nc \
              --arg id "$1" \
              --arg name "$(service_label "$1")" \
              --arg dockerfile "$1/Dockerfile" \
              '{id: $id, name: $name, dockerfile: $dockerfile}'
          }

          changed_files() {
            if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
              git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}" >/dev/null 2>&1 || true
              git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" 2>/dev/null || git show --pretty='' --name-only HEAD
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --name-only HEAD^ HEAD
            else
              git show --pretty='' --name-only HEAD
            fi
          }

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${INPUT_SCOPE:-all}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            mode="changed"
          else
            mode="all"
          fi

          selected_java=()
          selected_analytics=false
          selected_frontend=false

          select_all() {
            selected_java=("${JAVA_SERVICES[@]}")
            selected_analytics=true
            selected_frontend=true
          }

          select_changed() {
            local changed
            changed="$(changed_files)"

            if echo "$changed" | grep -Eq '^(frontend/|\.github/workflows/(ci|frontend-ci-cd)\.yml$)'; then
              selected_frontend=true
            fi

            if echo "$changed" | grep -Eq '^(common/|shared-api/|pom.xml$)'; then
              selected_java=("${JAVA_SERVICES[@]}")
              selected_analytics=true
              return
            fi

            if echo "$changed" | grep -Eq '^(analytics-service/|shared-api/src/main/proto/)'; then
              selected_analytics=true
            fi

            for service in "${JAVA_SERVICES[@]}"; do
              if echo "$changed" | grep -Eq "^${service}/"; then
                selected_java+=("$service")
              fi
            done
          }

          select_requested() {
            local raw="$1"
            IFS=',' read -ra requested <<< "$raw"
            for item in "${requested[@]}"; do
              item="$(echo "$item" | xargs)"
              case "$item" in
                frontend|frontend-web|frontend-web-app) selected_frontend=true ;;
                analytics|analytics-service) selected_analytics=true ;;
                all|all-services|all-backend) select_all ;;
                *)
                  for service in "${JAVA_SERVICES[@]}"; do
                    if [ "$service" = "$item" ]; then
                      selected_java+=("$service")
                    fi
                  done
                  ;;
              esac
            done
          }

          case "$mode" in
            all|all-services|all-backend) select_all ;;
            changed) select_changed ;;
            *) select_requested "$mode" ;;
          esac

          mapfile -t selected_java < <(printf '%s\n' "${selected_java[@]}" | awk 'NF && !seen[$0]++')

          java_json="$(for service in "${selected_java[@]}"; do service_json "$service"; done | jq -sc .)"

          container_items=("${selected_java[@]}")
          if [ "$selected_analytics" = "true" ]; then
            container_items+=(analytics-service)
          fi
          container_json="$(for service in "${container_items[@]}"; do service_json "$service"; done | jq -sc .)"

          labels=()
          if [ "$selected_frontend" = "true" ]; then
            labels+=("$(service_label frontend)")
          fi
          for service in "${selected_java[@]}"; do
            labels+=("$(service_label "$service")")
          done
          if [ "$selected_analytics" = "true" ]; then
            labels+=("$(service_label analytics-service)")
          fi
          if [ ${#labels[@]} -eq 0 ]; then
            label_text="none"
          else
            printf -v label_text "%s, " "${labels[@]}"
            label_text="${label_text%, }"
          fi

          echo "frontend=$selected_frontend" >> "$GITHUB_OUTPUT"
          echo "analytics=$selected_analytics" >> "$GITHUB_OUTPUT"
          echo "any-java=$([ ${#selected_java[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "any-container=$([ ${#container_items[@]} -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "java-matrix=$java_json" >> "$GITHUB_OUTPUT"
          echo "container-matrix=$container_json" >> "$GITHUB_OUTPUT"
          echo "selected-labels=$label_text" >> "$GITHUB_OUTPUT"

          {
            echo "## 01 Scope"
            echo "- mode: ${mode}"
            echo "- selected workloads: ${label_text}"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-quality:
    name: 02 Frontend - Type, Unit, Integration and Build
    needs: scope
    if: always() && needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --pretty false

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test -- --run

      - name: Build Firebase hosting artifact
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.aquashield.live' }}
          VITE_WS_BASE_URL: ${{ vars.VITE_WS_BASE_URL || 'wss://api.aquashield.live/ws' }}
        run: npm run build

      - name: Publish frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frontend Evidence - Type Unit Integration Build
          path: |
            frontend/dist/
            frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  backend-quality:
    name: 03 Backend - Type, Unit and Integration - ${{ matrix.service.name }}
    needs: [scope, frontend-quality]
    if: always() && needs.scope.outputs.any-java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.scope.outputs.java-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Maven type, unit and integration evidence
        run: mvn -B -ntp -pl ${{ matrix.service.id }} -am verify

      - name: Publish backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Backend Test Evidence - ${{ matrix.service.name }}
          path: |
            ${{ matrix.service.id }}/target/surefire-reports/
            ${{ matrix.service.id }}/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  analytics-quality:
    name: 04 Backend Analytics - Type, Unit and Integration
    needs: [scope, backend-quality]
    if: always() && needs.scope.outputs.analytics == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: analytics-service/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  sast:
    name: 05 SAST - Frontend and Backend Semgrep
    needs: [frontend-quality, backend-quality, analytics-quality]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run static application security test
        run: |
          set -euo pipefail
          pip install --quiet semgrep
          semgrep scan \
            --config p/java \
            --config p/javascript \
            --config p/typescript \
            --config p/security-audit \
            --json \
            --output semgrep-report.json
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --error \
            --json \
            --output semgrep-gated-report.json || SEMGREP_EXIT=$?
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --text || true
          exit ${SEMGREP_EXIT:-0}

      - name: Publish SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security Evidence - Semgrep SAST Report
          path: |
            semgrep-report.json
            semgrep-gated-report.json
          if-no-files-found: ignore
          retention-days: 30

  secret-scan:
    name: 06 Secrets - Gitleaks
    needs: sast
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-sbom:
    name: 07 Trivy Dependencies and SBOM
    needs: secret-scan
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Trivy filesystem gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table

      - name: Generate Trivy filesystem evidence
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true
          format: json
          output: trivy-fs-report.json

      - name: Generate backend SBOM
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Publish dependency and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security Evidence - Trivy FS and CycloneDX SBOM
          path: |
            trivy-fs-report.json
            target/bom.*
          if-no-files-found: ignore
          retention-days: 30

  container-management:
    name: 08 Container - Build, Inspect and Trivy - ${{ matrix.service.name }}
    needs: [scope, dependency-sbom]
    if: always() && needs.scope.outputs.any-container == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.scope.outputs.container-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -f ${{ matrix.service.dockerfile }} -t ${{ matrix.service.id }}:${{ github.sha }} .

      - name: Inspect container image
        run: docker image inspect ${{ matrix.service.id }}:${{ github.sha }} > image-inspect-${{ matrix.service.id }}.json

      - name: Trivy image gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service.id }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate Trivy image evidence
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service.id }}:${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          ignore-unfixed: true
          format: json
          output: trivy-image-${{ matrix.service.id }}.json

      - name: Publish container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Container Evidence - ${{ matrix.service.name }}
          path: |
            image-inspect-${{ matrix.service.id }}.json
            trivy-image-${{ matrix.service.id }}.json
          if-no-files-found: ignore
          retention-days: 30

  compliance-as-code:
    name: 09 Compliance as Code - Terraform and Kustomize
    needs: container-management
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.2

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Terraform validate
        run: |
          set -euo pipefail
          terraform -chdir=infra/environments/dev init -backend=false
          terraform -chdir=infra/environments/dev validate

      - name: Kustomize render check
        run: |
          set -euo pipefail
          mkdir -p compliance-evidence
          kubectl kustomize k8s/overlays/performance-managed-public > compliance-evidence/kustomize-performance-managed-public.yaml
          kubectl kustomize k8s/overlays/dev-full > compliance-evidence/kustomize-dev-full.yaml

      - name: Publish compliance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Compliance Evidence - Terraform Kustomize
          path: compliance-evidence/
          if-no-files-found: ignore
          retention-days: 30

  ci-summary:
    name: 10 CI Evidence Summary
    needs:
      - scope
      - frontend-quality
      - backend-quality
      - analytics-quality
      - sast
      - secret-scan
      - dependency-sbom
      - container-management
      - compliance-as-code
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish sequential CI evidence summary
        env:
          SELECTED_SERVICES: ${{ needs.scope.outputs.selected-labels }}
        run: |
          {
            echo "## AquaShield CI Evidence"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| 01 Scope | ${{ needs.scope.result }} |"
            echo "| 02 Frontend type/unit/integration/build | ${{ needs.frontend-quality.result }} |"
            echo "| 03 Backend type/unit/integration | ${{ needs.backend-quality.result }} |"
            echo "| 04 Analytics type/unit/integration | ${{ needs.analytics-quality.result }} |"
            echo "| 05 SAST | ${{ needs.sast.result }} |"
            echo "| 06 Secrets | ${{ needs.secret-scan.result }} |"
            echo "| 07 Trivy dependencies and SBOM | ${{ needs.dependency-sbom.result }} |"
            echo "| 08 Container build/inspect/Trivy | ${{ needs.container-management.result }} |"
            echo "| 09 Compliance as Code | ${{ needs.compliance-as-code.result }} |"
            echo
            echo "Selected workloads: ${SELECTED_SERVICES:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for result in \
            "${{ needs.scope.result }}" \
            "${{ needs.frontend-quality.result }}" \
            "${{ needs.backend-quality.result }}" \
            "${{ needs.analytics-quality.result }}" \
            "${{ needs.sast.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.dependency-sbom.result }}" \
            "${{ needs.container-management.result }}" \
            "${{ needs.compliance-as-code.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=1
            fi
          done

          exit "$failed"
