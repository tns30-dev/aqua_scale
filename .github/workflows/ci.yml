# AquaShield path-aware CI (spec: cooking_tracker/main/ci.md)
# Monorepo discipline: a commit touching only one service builds/tests/scans ONLY that
# service; shared modules (common/, shared-api/, root pom) fan out to every Java service.
# Image PUSH + GitOps handoff are a separate workflow (needs Artifact Registry + OIDC/WIF
# from the cloud foundation). TODO(security): pin actions to commit SHAs before cloud go-live.

name: Backend Service CI - Build, Test & Security

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      service_scope:
        description: "Evidence scope: changed, all, or comma-separated service ids"
        required: false
        default: changed

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Select Changed Backend Services
    runs-on: ubuntu-latest
    outputs:
      java-matrix: ${{ steps.matrix.outputs.java }}
      any-java: ${{ steps.matrix.outputs.any }}
      any-analytics: ${{ steps.matrix.outputs.analytics }}
      selected-labels: ${{ steps.matrix.outputs.selected-labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:
              - 'common/**'
              - 'shared-api/**'
              - 'pom.xml'
            identity-access-service: ['identity-access-service/**']
            project-service: ['project-service/**']
            sensor-service: ['sensor-service/**']
            ingestion-service: ['ingestion-service/**']
            notification-service: ['notification-service/**']
            realtime-gateway: ['realtime-gateway/**']
            pond-service: ['pond-service/**']
            audit-service: ['audit-service/**']
            # analytics is TS but consumes the shared-api protos — proto changes fan out
            analytics:
              - 'analytics-service/**'
              - 'shared-api/src/main/proto/**'
      - id: matrix
        name: Select backend services
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SCOPE: ${{ inputs.service_scope }}
          SHARED: ${{ steps.filter.outputs.shared }}
          ANALYTICS_CHANGED: ${{ steps.filter.outputs.analytics }}
          CHANGES: ${{ toJSON(steps.filter.outputs) }}
        run: |
          JAVA_SERVICES=(identity-access-service project-service sensor-service ingestion-service notification-service realtime-gateway pond-service audit-service)
          ALL_SERVICES=("${JAVA_SERVICES[@]}" analytics-service)

          service_label() {
            case "$1" in
              identity-access-service) echo "Identity and Access Service" ;;
              project-service) echo "Project Service" ;;
              sensor-service) echo "Sensor Service" ;;
              ingestion-service) echo "Ingestion Service" ;;
              notification-service) echo "Notification Service" ;;
              realtime-gateway) echo "Realtime Gateway" ;;
              pond-service) echo "Pond Service" ;;
              audit-service) echo "Audit Service" ;;
              analytics-service) echo "Analytics Service" ;;
              *) echo "$1" ;;
            esac
          }

          service_json() {
            jq -n \
              --arg id "$1" \
              --arg name "$(service_label "$1")" \
              '{id: $id, name: $name}'
          }

          selected_from_input() {
            local raw="${INPUT_SCOPE:-changed}"
            if [ "$raw" = "all" ] || [ "$raw" = "all-backend" ] || [ "$raw" = "all-services" ]; then
              printf '%s\n' "${ALL_SERVICES[@]}"
              return
            fi

            local requested=()
            IFS=',' read -ra parts <<< "$raw"
            for item in "${parts[@]}"; do
              item="$(echo "$item" | xargs)"
              [ -n "$item" ] && requested+=("$item")
            done

            for service in "${ALL_SERVICES[@]}"; do
              for item in "${requested[@]}"; do
                if [ "$service" = "$item" ]; then
                  echo "$service"
                fi
              done
            done
          }

          SELECTED=()
          ANALYTICS_SELECTED="$ANALYTICS_CHANGED"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_SCOPE:-changed}" != "changed" ]; then
            mapfile -t REQUESTED < <(selected_from_input)
            ANALYTICS_SELECTED=false
            for s in "${REQUESTED[@]}"; do
              if [ "$s" = "analytics-service" ]; then
                ANALYTICS_SELECTED=true
              else
                SELECTED+=("$s")
              fi
            done
          else
            for s in "${JAVA_SERVICES[@]}"; do
              flag=$(echo "$CHANGES" | jq -r --arg k "$s" '.[$k] // "false"')
              if [ "$SHARED" = "true" ] || [ "$flag" = "true" ]; then
                SELECTED+=("$s")
              fi
            done
          fi

          if [ ${#SELECTED[@]} -eq 0 ]; then
            echo "java=[]" >> "$GITHUB_OUTPUT"
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            json="$(for s in "${SELECTED[@]}"; do service_json "$s"; done | jq -s -c .)"
            echo "java=$json" >> "$GITHUB_OUTPUT"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

          LABELS=()
          for s in "${SELECTED[@]}"; do
            LABELS+=("$(service_label "$s")")
          done
          if [ "$ANALYTICS_SELECTED" = "true" ]; then
            LABELS+=("$(service_label analytics-service)")
          fi
          if [ ${#LABELS[@]} -eq 0 ]; then
            label_text="none"
          else
            printf -v label_text "%s, " "${LABELS[@]}"
            label_text="${label_text%, }"
          fi
          echo "analytics=$ANALYTICS_SELECTED" >> "$GITHUB_OUTPUT"
          echo "selected-labels=$label_text" >> "$GITHUB_OUTPUT"
          echo "Selected services: $label_text"

  # ---------- build + unit + integration tests (Testcontainers) per changed service ----------
  java-verify:
    name: Backend Build & Test - ${{ matrix.service.name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.any-java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.java-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run unit and integration tests
        run: mvn -B -ntp -pl ${{ matrix.service.id }} -am verify
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test Evidence - ${{ matrix.service.name }}
          path: |
            ${{ matrix.service.id }}/target/surefire-reports/
            ${{ matrix.service.id }}/target/failsafe-reports/
          retention-days: 14

  # ---------- analytics-service (TypeScript) — typecheck + vitest + container ----------
  analytics-verify:
    name: Analytics Service Build & Test
    needs: detect-changes
    if: needs.detect-changes.outputs.any-analytics == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: analytics-service/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run analytics tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  analytics-container:
    name: Analytics Container Build & Scan
    needs: [detect-changes, analytics-verify]
    if: needs.detect-changes.outputs.any-analytics == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build analytics image
        run: docker build -f analytics-service/Dockerfile -t analytics-service:${{ github.sha }} .
      - name: Scan analytics image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: analytics-service:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # ---------- security gates (repo-wide; always run — they ARE the evidence) ----------
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Static Security Scan - Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static application security test
        run: |
          pip install --quiet semgrep
          semgrep scan --config p/java --config p/security-audit \
            --error --json --output semgrep-report.json || SEMGREP_EXIT=$?
          semgrep scan --config p/java --config p/security-audit --text || true
          exit ${SEMGREP_EXIT:-0}
      - name: Publish SAST evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security Evidence - Semgrep SAST Report
          path: semgrep-report.json
          retention-days: 30

  sca-and-secrets-fs:
    name: Dependency and Config Scan - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies and configuration
        # gate on CRITICAL (zero after the Boot 3.5.14 + tomcat 10.1.55 hardening);
        # HIGH is reported in the json artifact — ratchet the gate once HIGHs are burned down
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Generate dependency scan evidence
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'
          format: json
          output: trivy-fs-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security Evidence - Trivy Filesystem Report
          path: trivy-fs-report.json
          retention-days: 30

  sbom:
    name: Software Bill of Materials - CycloneDX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - uses: actions/upload-artifact@v4
        with:
          name: Security Evidence - CycloneDX SBOM
          path: target/bom.*
          retention-days: 30

  # ---------- container build + image scan per changed service (no push yet) ----------
  container:
    name: Container Build & Image Scan - ${{ matrix.service.name }}
    needs: [detect-changes, java-verify]
    if: needs.detect-changes.outputs.any-java == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.java-matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build -f ${{ matrix.service.id }}/Dockerfile -t ${{ matrix.service.id }}:${{ github.sha }} .
      - name: Scan service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.service.id }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      # push to Artifact Registry + Kustomize tag bump land in deploy-handoff.yml
      # once the cloud foundation (registry + OIDC/WIF) exists.

  ci-summary:
    name: CI Evidence
    needs: [detect-changes, java-verify, analytics-verify, analytics-container, secret-scan, sast, sca-and-secrets-fs, sbom, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI evidence
        env:
          SELECTED_SERVICES: ${{ needs.detect-changes.outputs.selected-labels }}
        run: |
          {
            echo "## CI Evidence"
            echo "- selected services: ${SELECTED_SERVICES:-none}"
            echo "- backend build and tests: ${{ needs.java-verify.result }}"
            echo "- analytics build and tests: ${{ needs.analytics-verify.result }}"
            echo "- analytics container scan: ${{ needs.analytics-container.result }}"
            echo "- secret scan: ${{ needs.secret-scan.result }}"
            echo "- static security scan: ${{ needs.sast.result }}"
            echo "- dependency and config scan: ${{ needs.sca-and-secrets-fs.result }}"
            echo "- software bill of materials: ${{ needs.sbom.result }}"
            echo "- backend container build and scan: ${{ needs.container.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
