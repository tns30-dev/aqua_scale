apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Performance evidence overlay for the full dev runtime. It keeps the same
# service topology but raises auth throttling so k6 can measure application
# endpoints instead of setup-login backoff.
resources:
  - ../dev-full

patches:
  - target:
      kind: ConfigMap
      name: identity-access-service-config
    patch: |-
      - op: replace
        path: /data/LOGIN_RATE_LIMIT
        value: "10000"
      - op: replace
        path: /data/LOGIN_RATE_WINDOW
        value: "PT15M"
