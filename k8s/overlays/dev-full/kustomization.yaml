apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aquashield-dev

resources:
  - namespace.yaml
  - runtime-secrets.yaml
  - runtime-dependencies.yaml
  - pubsub-bootstrap.yaml
  - service-accounts.yaml
  - ../../base/services/identity-access-service
  - ../../base/services/project-service
  - ../../base/services/pond-service
  - ../../base/services/sensor-service
  - ../../base/services/ingestion-service
  - ../../base/services/notification-service
  - ../../base/services/realtime-gateway
  - ../../base/services/analytics-service
  - ../../base/services/audit-service
  - peer-authentication.yaml
  - default-deny-authorization-policy.yaml
  - default-deny-ingress.yaml
  - allow-app-internal-traffic.yaml
  - allow-gclb-health-checks.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/environment: dev
      app.kubernetes.io/part-of: aquashield
  - pairs:
      app.kubernetes.io/runtime-slice: full-dev

patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/component in (audit,identity,ingestion,notification,pond,project,realtime,sensor)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 60
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
        value: 12
  - target:
      kind: Deployment
      name: identity-access-service
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "2"
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
      - op: add
        path: /spec/template/metadata/annotations
        value:
          sidecar.istio.io/proxyCPU: 25m
          sidecar.istio.io/proxyMemory: 64Mi
          sidecar.istio.io/proxyCPULimit: 250m
          sidecar.istio.io/proxyMemoryLimit: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
        value: dev-db-passwords
      - op: replace
        path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/key
        value: IDENTITY_ACCESS_DB_PASSWORD
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BOOTSTRAP_ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: identity-access-service-secrets
              key: BOOTSTRAP_ADMIN_EMAIL
              optional: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-access-service-secrets
              key: BOOTSTRAP_ADMIN_PASSWORD
              optional: true
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 768Mi
