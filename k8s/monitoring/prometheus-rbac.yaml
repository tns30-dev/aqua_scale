apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aquashield-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aquashield-prometheus-scrape
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aquashield-monitoring
rules:
  - apiGroups: [""]
    resources:
      - endpoints
      - nodes
      - nodes/proxy
      - pods
      - services
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aquashield-prometheus-scrape
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: aquashield-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aquashield-prometheus-scrape
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
