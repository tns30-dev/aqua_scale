apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: aquashield-dev
  labels:
    app.kubernetes.io/environment: dev
    app.kubernetes.io/part-of: aquashield
    app.kubernetes.io/runtime-slice: managed-gcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/environment: dev
      app.kubernetes.io/part-of: aquashield
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 15020
