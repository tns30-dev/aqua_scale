apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: ingestion-service-allow-actuator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-service
  action: ALLOW
  rules:
    - to:
        - operation:
            ports:
              - "8084"
            paths:
              - /actuator/health
              - /actuator/health/*
              - /actuator/info
              - /actuator/metrics
              - /actuator/metrics/*
