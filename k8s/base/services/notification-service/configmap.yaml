apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  SERVER_PORT: "8087"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "aquashield"
  DB_USER: "notification_svc"
  DB_POOL_SIZE: "10"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  PUBSUB_PROJECT_ID: "aquashield-dev"
  PUBSUB_EMULATOR_HOST: ""
  READINGS_SUBSCRIPTION: "notification.reading.ingested.sub"
  SETTINGS_SUBSCRIPTION: "notification.project.settings.updated.sub"
  THRESHOLD_CACHE_TTL: "PT15M"
  PROJECT_GRPC_TARGET: "project-service:9092"
  PROJECT_GRPC_INPROCESS: ""
  JWT_ISSUER: "aquashield"
  JWT_AUDIENCE: "aquashield-api"
  EVENTS_ENABLED: "true"
