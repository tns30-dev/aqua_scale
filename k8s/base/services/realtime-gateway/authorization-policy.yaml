apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: realtime-gateway-allow-http-ws
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: realtime-gateway
  action: ALLOW
  rules:
    - to:
        - operation:
            ports:
              - "8088"
            paths:
              - /ws
              - /ws/*
              - /actuator/health
              - /actuator/health/*
              - /actuator/info
              - /actuator/metrics
              - /actuator/metrics/*
