apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: identity-access-service-allow-http
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-access-service
  action: ALLOW
  rules:
    - to:
        - operation:
            ports:
              - "8081"
            paths:
              - /api/csrf
              - /api/auth
              - /api/auth/*
              - /api/users
              - /api/users*
              - /api/users/*
              - /actuator/health
              - /actuator/health/*
    - to:
        - operation:
            ports:
              - "9091"
