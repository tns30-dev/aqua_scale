apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: project-service-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: project-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: aquashield
      ports:
        - protocol: TCP
          port: 8082
        - protocol: TCP
          port: 9092
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8082
