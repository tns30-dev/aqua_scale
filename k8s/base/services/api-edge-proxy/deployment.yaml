apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-edge-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-edge-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-edge-proxy
        app.kubernetes.io/component: api-edge
        app.kubernetes.io/part-of: aquashield
      annotations:
        config.aquashield.dev/api-edge-proxy-config-version: "2026-06-05-cors-frontend-origin"
        sidecar.istio.io/proxyCPU: 25m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyCPULimit: 250m
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      serviceAccountName: api-edge-proxy
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: api-edge-proxy-config
        - name: tmp
          emptyDir: {}
