apiVersion: v1
kind: ConfigMap
metadata:
  name: api-edge-proxy-config
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;

    events {
      worker_connections 512;
    }

    http {
      access_log /dev/stdout;
      error_log /dev/stderr warn;

      proxy_temp_path /tmp/proxy_temp;
      client_body_temp_path /tmp/client_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
      }

      map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
      }

      upstream identity { server identity-access-service:8081; }
      upstream project { server project-service:8082; }
      upstream sensor { server sensor-service:8083; }
      upstream notification { server notification-service:8087; }
      upstream realtime { server realtime-gateway:8088; }
      upstream pond { server pond-service:8089; }
      upstream analytics { server analytics-service:8090; }
      upstream audit { server audit-service:8092; }

      server {
        listen 8080;
        server_tokens off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        location = /healthz {
          default_type application/json;
          return 200 '{"status":"UP"}';
        }

        location ~ ^/api/projects/[^/]+/charts(/.*)?$ { proxy_pass http://analytics; }
        location ~ ^/api/projects/[^/]+/pond-comparison { proxy_pass http://pond; }
        location ~ ^/api/projects/[^/]+/ponds { proxy_pass http://pond; }
        location ~ ^/api/projects/[^/]+/sensors { proxy_pass http://sensor; }

        location /api/auth/ { proxy_pass http://identity; }
        location /api/users { proxy_pass http://identity; }
        location /api/feature-access { proxy_pass http://identity; }
        location /api/action-controls { proxy_pass http://identity; }

        location /api/profile-types { proxy_pass http://project; }
        location /api/parameter-types { proxy_pass http://project; }
        location /api/growth-indicators { proxy_pass http://project; }
        location /api/projects { proxy_pass http://project; }

        location /api/ponds { proxy_pass http://pond; }
        location /api/cycles { proxy_pass http://pond; }
        location /api/treatments { proxy_pass http://pond; }
        location /api/pond-treatments { proxy_pass http://pond; }

        location /api/iot-devices { proxy_pass http://sensor; }
        location /api/sensor-types { proxy_pass http://sensor; }
        location /api/project-sensors { proxy_pass http://sensor; }

        location /api/alerts { proxy_pass http://notification; }
        location /api/analytics { proxy_pass http://analytics; }
        location /api/audit { proxy_pass http://audit; }

        location /ws/token { proxy_pass http://realtime; }
        location /ws {
          proxy_pass http://realtime;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_read_timeout 3600s;
        }

        location /api/ {
          default_type application/json;
          return 404 '{"detail":"No route (api-edge-proxy)"}';
        }
      }
    }
