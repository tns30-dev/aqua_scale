apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service-accounts.yaml
  - services/identity-access-service
  - services/project-service
  - services/pond-service
  - jobs/pond-daily-health
  - services/sensor-service
  - services/ingestion-service
  - services/notification-service
  - services/realtime-gateway
  - services/analytics-service
  - services/audit-service
  - edge
  - mesh/peer-authentication.yaml
  - mesh/default-deny-authorization-policy.yaml
  - network/default-deny-ingress.yaml
  - network/allow-app-internal-traffic.yaml
  - network/allow-gclb-health-checks.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: aquashield
    includeSelectors: true
