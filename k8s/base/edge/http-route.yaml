apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aquashield-api-routes
  labels:
    app.kubernetes.io/component: api-edge
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: aquashield-api-gateway
      sectionName: https
  hostnames:
    - api.aquashield.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/auth
        - path:
            type: PathPrefix
            value: /api/users
      backendRefs:
        - name: identity-access-service
          port: 8081
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/projects/[^/]+/sensors(/.*)?$
      backendRefs:
        - name: sensor-service
          port: 8083
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/projects/[^/]+/ponds(/.*)?$
        - path:
            type: RegularExpression
            value: ^/api/projects/[^/]+/pond-comparison(/.*)?$
      backendRefs:
        - name: pond-service
          port: 8089
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/projects/[^/]+/charts/?$
      backendRefs:
        - name: analytics-service
          port: 8090
    - matches:
        - path:
            type: PathPrefix
            value: /api/projects
        - path:
            type: PathPrefix
            value: /api/profile-types
        - path:
            type: PathPrefix
            value: /api/parameter-types
        - path:
            type: PathPrefix
            value: /api/growth-indicators
      backendRefs:
        - name: project-service
          port: 8082
    - matches:
        - path:
            type: PathPrefix
            value: /api/ponds
        - path:
            type: PathPrefix
            value: /api/cycles
        - path:
            type: PathPrefix
            value: /api/treatments
        - path:
            type: PathPrefix
            value: /api/pond-treatments
      backendRefs:
        - name: pond-service
          port: 8089
    - matches:
        - path:
            type: PathPrefix
            value: /api/sensors
        - path:
            type: PathPrefix
            value: /api/sensor-types
        - path:
            type: PathPrefix
            value: /api/iot-devices
        - path:
            type: PathPrefix
            value: /api/project-sensors
      backendRefs:
        - name: sensor-service
          port: 8083
    - matches:
        - path:
            type: PathPrefix
            value: /api/alerts
      backendRefs:
        - name: notification-service
          port: 8087
    - matches:
        - path:
            type: PathPrefix
            value: /api/analytics
      backendRefs:
        - name: analytics-service
          port: 8090
    - matches:
        - path:
            type: PathPrefix
            value: /api/audit
      backendRefs:
        - name: audit-service
          port: 8092
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: realtime-gateway
          port: 8088
