apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aquashield-api-http-redirect
  labels:
    app.kubernetes.io/component: api-edge
spec:
  parentRefs:
    - name: aquashield-api-gateway
      sectionName: http
  hostnames:
    - api.aquashield.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
